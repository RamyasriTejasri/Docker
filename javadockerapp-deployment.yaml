apiVersion: apps/v1
kind: Deployment
metadata:
  name: javadockerapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: javadockerapp
  template:
    metadata:
      labels:
        app: javadockerapp
    spec:
      containers:
      - name: javadockerapp
        image: javadockerapp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080